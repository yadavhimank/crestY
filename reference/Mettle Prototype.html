<!doctype html>
<html lang="en" data-mettle-theme="light" data-mettle-type="instrument">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mettle — Operating Systems for Businesses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=DM+Serif+Display:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
  />
  <link rel="stylesheet" href="styles/tokens.css" />
  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: var(--m-bg);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--m-ink);
      overscroll-behavior: none;
    }
    input, textarea, button { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: var(--m-ink-4); }

    /* Hide scrollbar visual on the inner stage but keep functionality */
    [data-site-scroll] { scrollbar-gutter: stable; }
    [data-site-scroll]::-webkit-scrollbar { width: 10px; height: 10px; }
    [data-site-scroll]::-webkit-scrollbar-thumb {
      background: var(--m-line-2); border-radius: 999px;
      border: 2px solid var(--m-bg);
    }
    [data-site-scroll]::-webkit-scrollbar-thumb:hover { background: var(--m-ink-4); }
    [data-site-scroll]::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks panel (shared starter component) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Mettle design system primitives -->
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/page-chrome.jsx"></script>
  <script type="text/babel" src="src/page-home.jsx"></script>

  <!-- Site shell + pages -->
  <script type="text/babel" src="src/site/site-frame.jsx"></script>
  <script type="text/babel" src="src/site/page-home.jsx"></script>
  <script type="text/babel" src="src/site/page-services.jsx"></script>
  <script type="text/babel" src="src/site/page-work.jsx"></script>
  <script type="text/babel" src="src/site/page-how.jsx"></script>
  <script type="text/babel" src="src/site/page-about.jsx"></script>
  <script type="text/babel" src="src/site/page-contact.jsx"></script>

  <!-- Bootstrap -->
  <script type="text/babel" src="src/site/app.jsx"></script>
</body>
</html>
